trigger: none

parameters:
  - name: env
    type: string
    default: Dev
    values:
      - Dev
      - ITG
      - Prod

  - name: action
    type: string
    default: Plan
    values:
      - Plan
      - Apply
      - Destroy

variables:
  terraformVersion: '1.6.6'
  azureServiceConnection: 'dev-sub'

  # Backend (must already exist)
  backendResourceGroupName_DEV: 'isac-dev-rg'
  backendResourceGroupName_ITG: 'isac-itg-rg'
  backendResourceGroupName_PROD: 'isac-pro-rg'

  backendStorageAccountName_DEV: 'isactfstatedev'
  backendStorageAccountName_ITG: 'isactfstateitg'
  backendStorageAccountName_PROD: 'isactfstateprod'

  backendContainerName: 'tfstate'

jobs:

# ================= PLAN =================
- ${{ if eq(parameters.action, 'Plan') }}:
  - deployment: TerraformPlan
    displayName: "Terraform Plan - ${{ parameters.env }}"
    environment: ${{ parameters.env }}
    pool:
      vmImage: ubuntu-latest

    variables:
      ${{ if eq(parameters.env, 'Dev') }}:
        tfvarsFile: 'environments/dev.tfvars'
        tfStateFile: 'dev.tfstate'
        backendRG: $(backendResourceGroupName_DEV)
        backendSA: $(backendStorageAccountName_DEV)

      ${{ if eq(parameters.env, 'ITG') }}:
        tfvarsFile: 'environments/itg.tfvars'
        tfStateFile: 'itg.tfstate'
        backendRG: $(backendResourceGroupName_ITG)
        backendSA: $(backendStorageAccountName_ITG)

      ${{ if eq(parameters.env, 'Prod') }}:
        tfvarsFile: 'environments/prod.tfvars'
        tfStateFile: 'prod.tfstate'
        backendRG: $(backendResourceGroupName_PROD)
        backendSA: $(backendStorageAccountName_PROD)

    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self

            - task: TerraformInstaller@1
              inputs:
                terraformVersion: $(terraformVersion)

            - task: AzureCLI@2
              displayName: Terraform Init
              inputs:
                azureSubscription: $(azureServiceConnection)
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  terraform init \
                    -backend-config="resource_group_name=$(backendRG)" \
                    -backend-config="storage_account_name=$(backendSA)" \
                    -backend-config="container_name=$(backendContainerName)" \
                    -backend-config="key=$(tfStateFile)"
              env:
                ARM_CLIENT_ID: $(servicePrincipalId)
                ARM_CLIENT_SECRET: $(servicePrincipalKey)
                ARM_SUBSCRIPTION_ID: $(subscriptionId)
                ARM_TENANT_ID: $(tenantId)

            - task: AzureCLI@2
              displayName: Terraform Plan
              inputs:
                azureSubscription: $(azureServiceConnection)
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  terraform plan \
                    -var-file="$(tfvarsFile)" \
                    -out=tfplan
              env:
                ARM_CLIENT_ID: $(servicePrincipalId)
                ARM_CLIENT_SECRET: $(servicePrincipalKey)
                ARM_SUBSCRIPTION_ID: $(subscriptionId)
                ARM_TENANT_ID: $(tenantId)


# ================= APPLY =================
- ${{ if eq(parameters.action, 'Apply') }}:
  - deployment: TerraformApply
    displayName: "Terraform Apply - ${{ parameters.env }}"
    environment: ${{ parameters.env }}
    pool:
      vmImage: ubuntu-latest

    variables:
      ${{ if eq(parameters.env, 'Dev') }}:
        tfvarsFile: 'environments/dev.tfvars'
        tfStateFile: 'dev.tfstate'
        backendRG: $(backendResourceGroupName_DEV)
        backendSA: $(backendStorageAccountName_DEV)

      ${{ if eq(parameters.env, 'ITG') }}:
        tfvarsFile: 'environments/itg.tfvars'
        tfStateFile: 'itg.tfstate'
        backendRG: $(backendResourceGroupName_ITG)
        backendSA: $(backendStorageAccountName_ITG)

      ${{ if eq(parameters.env, 'Prod') }}:
        tfvarsFile: 'environments/prod.tfvars'
        tfStateFile: 'prod.tfstate'
        backendRG: $(backendResourceGroupName_PROD)
        backendSA: $(backendStorageAccountName_PROD)

    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self

            - task: TerraformInstaller@1
              inputs:
                terraformVersion: $(terraformVersion)

            - task: AzureCLI@2
              displayName: Terraform Init
              inputs:
                azureSubscription: $(azureServiceConnection)
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  terraform init \
                    -backend-config="resource_group_name=$(backendRG)" \
                    -backend-config="storage_account_name=$(backendSA)" \
                    -backend-config="container_name=$(backendContainerName)" \
                    -backend-config="key=$(tfStateFile)"
              env:
                ARM_CLIENT_ID: $(servicePrincipalId)
                ARM_CLIENT_SECRET: $(servicePrincipalKey)
                ARM_SUBSCRIPTION_ID: $(subscriptionId)
                ARM_TENANT_ID: $(tenantId)

            - task: AzureCLI@2
              displayName: Terraform Apply
              inputs:
                azureSubscription: $(azureServiceConnection)
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  terraform apply \
                    -var-file="$(tfvarsFile)" \
                    -auto-approve
              env:
                ARM_CLIENT_ID: $(servicePrincipalId)
                ARM_CLIENT_SECRET: $(servicePrincipalKey)
                ARM_SUBSCRIPTION_ID: $(subscriptionId)
                ARM_TENANT_ID: $(tenantId)


# ================= DESTROY =================
- ${{ if eq(parameters.action, 'Destroy') }}:
  - deployment: TerraformDestroy
    displayName: "Terraform Destroy - ${{ parameters.env }}"
    environment: ${{ parameters.env }}
    pool:
      vmImage: ubuntu-latest

    variables:
      ${{ if eq(parameters.env, 'Dev') }}:
        tfvarsFile: 'environments/dev.tfvars'
        tfStateFile: 'dev.tfstate'
        backendRG: $(backendResourceGroupName_DEV)
        backendSA: $(backendStorageAccountName_DEV)

      ${{ if eq(parameters.env, 'ITG') }}:
        tfvarsFile: 'environments/itg.tfvars'
        tfStateFile: 'itg.tfstate'
        backendRG: $(backendResourceGroupName_ITG)
        backendSA: $(backendStorageAccountName_ITG)

      ${{ if eq(parameters.env, 'Prod') }}:
        tfvarsFile: 'environments/prod.tfvars'
        tfStateFile: 'prod.tfstate'
        backendRG: $(backendResourceGroupName_PROD)
        backendSA: $(backendStorageAccountName_PROD)

    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self

            - task: TerraformInstaller@1
              inputs:
                terraformVersion: $(terraformVersion)

            - task: AzureCLI@2
              displayName: Terraform Init
              inputs:
                azureSubscription: $(azureServiceConnection)
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  terraform init \
                    -backend-config="resource_group_name=$(backendRG)" \
                    -backend-config="storage_account_name=$(backendSA)" \
                    -backend-config="container_name=$(backendContainerName)" \
                    -backend-config="key=$(tfStateFile)"
              env:
                ARM_CLIENT_ID: $(servicePrincipalId)
                ARM_CLIENT_SECRET: $(servicePrincipalKey)
                ARM_SUBSCRIPTION_ID: $(subscriptionId)
                ARM_TENANT_ID: $(tenantId)

            - task: AzureCLI@2
              displayName: Terraform Destroy
              inputs:
                azureSubscription: $(azureServiceConnection)
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  terraform destroy \
                    -var-file="$(tfvarsFile)" \
                    -auto-approve
              env:
                ARM_CLIENT_ID: $(servicePrincipalId)
                ARM_CLIENT_SECRET: $(servicePrincipalKey)
                ARM_SUBSCRIPTION_ID: $(subscriptionId)
                ARM_TENANT_ID: $(tenantId)

