parameters:
  - name: env
    displayName: "Action"
    type: string
    default: ADD
    values:
      - ADD
      - REMOVE

trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  location: centralindia

stages:

# =====================================
# ✅ CREATE INFRA (ADD)
# =====================================
- stage: CreateInfra
  displayName: "Create RG, Storage & Container"
  condition: eq('${{ parameters.env }}', 'ADD')
  jobs:
  - job: Deploy
    displayName: "Create Resources"
    steps:
    - task: AzureCLI@2
      displayName: "Create RG + Storage + Blob Container"
      inputs:
        azureSubscription: 'dev-sub'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |

          location=$(location)
          environments=("dev" "itg")

          for env in "${environments[@]}"
          do
            rg="isac-tfstate-${env}-rg"
            st="isactfstate${env}"
            container="tfstate"

            echo "==============================="
            echo "Processing: $env"
            echo "==============================="

            echo "Creating Resource Group: $rg"
            az group create --name $rg --location $location

            echo "Creating Storage Account: $st"
            az storage account create \
              --name $st \
              --resource-group $rg \
              --location $location \
              --sku Standard_LRS \
              --kind StorageV2

            echo "Waiting for storage account to be ready..."
            sleep 20

            echo "Creating Blob Container: tfstate"
            az storage container create \
              --name $container \
              --account-name $st \
              --auth-mode login

            echo "Enabling Versioning"
            az storage account blob-service-properties update \
              --account-name $st \
              --resource-group $rg \
              --enable-versioning true

          done

# =====================================
# ✅ DESTROY INFRA (REMOVE)
# =====================================
- stage: DestroyInfra
  displayName: "Destroy RG & Storage"
  condition: eq('${{ parameters.env }}', 'REMOVE')
  jobs:
  - job: Destroy
    displayName: "Delete Resource Groups"
    steps:
    - task: AzureCLI@2
      displayName: "Delete RGs"
      inputs:
        azureSubscription: 'dev-sub'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |

          environments=("dev" "itg")

          for env in "${environments[@]}"
          do
            rg="isac-tfstate-${env}-rg"

            echo "==============================="
            echo "Deleting: $rg"
            echo "==============================="

            az group delete \
              --name $rg \
              --yes \
              --no-wait

          done
