trigger:
- main   # change if needed

pool:
  vmImage: 'ubuntu-latest'

variables:
  location: centralindia

stages:
- stage: CreateInfra
  displayName: "Create RG, Storage & Container"
  jobs:
  - job: Deploy
    displayName: "Azure CLI Deployment"
    steps:

    - task: AzureCLI@2
      displayName: "Create RG + Storage + Blob Container"
      inputs:
        azureSubscription: 'dev-sub'   # 🔴 replace this
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |

          location=$(location)

          environments=("dev" "itg")

          for env in "${environments[@]}"
          do
            rg="isac-tfstate-${env}-rg"
            st="isactfstate${env}"
            container="tfstate"

            echo "==============================="
            echo "Processing environment: $env"
            echo "==============================="

            echo "Creating Resource Group: $rg"
            az group create \
              --name $rg \
              --location $location

            echo "Creating Storage Account: $st"
            az storage account create \
              --name $st \
              --resource-group $rg \
              --location $location \
              --sku Standard_LRS \
              --kind StorageV2

            echo "Fetching Storage Key"
            key=$(az storage account keys list \
              --resource-group $rg \
              --account-name $st \
              --query "[0].value" \
              -o tsv)

            echo "Creating Blob Container: $container"
            az storage container create \
              --name $container \
              --account-name $st \
              --account-key $key

            echo "Enabling Versioning (Best Practice)"
            az storage account blob-service-properties update \
              --account-name $st \
              --resource-group $rg \
              --enable-versioning true

          done
- stage: DestroyInfra
  displayName: "Destroy RG & Storage"
  dependsOn: CreateInfra   # runs after creation
  condition: succeeded()   # you can change this
  jobs:
  - job: Destroy
    displayName: "Delete Resource Groups"
    steps:

    - task: AzureCLI@2
      displayName: "Delete RGs"
      inputs:
        azureSubscription: 'dev-sub'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |

          environments=("dev" "itg")

          for env in "${environments[@]}"
          do
            rg="isac-tfstate-${env}-rg"

            echo "================================="
            echo "Deleting Resource Group: $rg"
            echo "================================="

            az group delete \
              --name $rg \
              --yes \
              --no-wait

          done