name: Terraform CICD

on:
  push:
    branches:
      - main
      - develop
      - relese

  pull_request:

  workflow_dispatch:
    inputs:
      environment:
        description: "Select Environment"
        required: true
        type: choice
        options:
          - dev
          - itg
          - prod

      action:
        description: "Select Action"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

      resource:
        description: "Select Resource"
        required: true
        type: choice
        options:
          - vm
          - aks
          - adf
          - all

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
      ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
      ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
      ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

    steps:

# =========================
# Checkout
# =========================
      - name: Checkout Code
        uses: actions/checkout@v4

# =========================
# Azure Login
# =========================
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

# =========================
# Terraform Setup
# =========================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          terraform_wrapper: false

      - name: Terraform Version
        run: terraform version

# =========================
# Environment Config
# =========================
      - name: Set Environment Config
        run: |
          ENV="${{ github.event.inputs.environment }}"
          RESOURCE="${{ github.event.inputs.resource }}"

          echo "ENV=$ENV" >> $GITHUB_ENV
          echo "RESOURCE=$RESOURCE" >> $GITHUB_ENV

          case "$ENV" in
            dev)
              echo "TFVARS=environments/dev.tfvars" >> $GITHUB_ENV
              echo "TFSTATE=dev.tfstate" >> $GITHUB_ENV
              echo "BACKEND_RG=isac-tfstate-dev-rg" >> $GITHUB_ENV
              echo "BACKEND_SA=isactfstatedev" >> $GITHUB_ENV
              ;;
            itg)
              echo "TFVARS=environments/itg.tfvars" >> $GITHUB_ENV
              echo "TFSTATE=itg.tfstate" >> $GITHUB_ENV
              echo "BACKEND_RG=isac-tfstate-itg-rg" >> $GITHUB_ENV
              echo "BACKEND_SA=isactfstateitg" >> $GITHUB_ENV
              ;;
            prod)
              echo "TFVARS=environments/prod.tfvars" >> $GITHUB_ENV
              echo "TFSTATE=prod.tfstate" >> $GITHUB_ENV
              echo "BACKEND_RG=isac-tfstate-prod-rg" >> $GITHUB_ENV
              echo "BACKEND_SA=isactfstateprod" >> $GITHUB_ENV
              ;;
          esac

          echo "CONTAINER=tfstate" >> $GITHUB_ENV

# =========================
# Debug
# =========================
      - name: Debug Variables
        run: |
          echo "ENV=$ENV"
          echo "RESOURCE=$RESOURCE"
          echo "TFVARS=$TFVARS"

# =========================
# Terraform Init
# =========================
      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=$BACKEND_RG" \
            -backend-config="storage_account_name=$BACKEND_SA" \
            -backend-config="container_name=$CONTAINER" \
            -backend-config="key=$TFSTATE" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

# =========================
# Set TARGET dynamically
# =========================
      - name: Set Target Resource
        run: |
          if [ "$RESOURCE" = "vm" ]; then
            echo "TARGET=-target=module.windows_vm" >> $GITHUB_ENV
          elif [ "$RESOURCE" = "aks" ]; then
            echo "TARGET=-target=module.aks" >> $GITHUB_ENV
          elif [ "$RESOURCE" = "adf" ]; then
            echo "TARGET=-target=module.adf" >> $GITHUB_ENV
          else
            echo "TARGET=" >> $GITHUB_ENV
          fi

# =========================
# Terraform Plan
# =========================
      - name: Terraform Plan
        if: github.event.inputs.action == 'plan'
        run: |
          terraform plan \
            $TARGET \
            -var-file="$TFVARS" \
            -input=false

# =========================
# Terraform Apply
# =========================
      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        run: |
          terraform apply -auto-approve \
            $TARGET \
            -var-file="$TFVARS" \
            -input=false

# =========================
# Terraform Destroy
# =========================
      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: |
          terraform destroy -auto-approve \
            $TARGET \
            -var-file="$TFVARS" \
            -input=false
