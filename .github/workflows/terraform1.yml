name: Terraform CICD

on:
  push:
    branches:
      - main
      - develop
      - relese

  pull_request:

  workflow_dispatch:
    inputs:
      environment:
        description: "Select Environment"
        required: true
        type: choice
        options:
          - dev
          - itg
          - prod

      action:
        description: "Select Action"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

      enable_vm:
        description: "Deploy VM (true/false)"
        required: false
        default: "false"

      enable_aks:
        description: "Deploy AKS (true/false)"
        required: false
        default: "true"

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
      ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
      ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
      ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          terraform_wrapper: false

      - name: Terraform Version
        run: terraform version

# =========================
# Environment Mapping
# =========================
      - name: Set Environment Config
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
            ENABLE_VM="${{ github.event.inputs.enable_vm }}"
            ENABLE_AKS="${{ github.event.inputs.enable_aks }}"
          else
            BRANCH="${GITHUB_REF##*/}"

            if [ "$BRANCH" = "main" ]; then
              ENV="dev"
            elif [ "$BRANCH" = "develop" ]; then
              ENV="itg"
            elif [ "$BRANCH" = "relese" ]; then
              ENV="prod"
            else
              ENV="dev"
            fi

            ENABLE_VM="false"
            ENABLE_AKS="true"
          fi

          echo "ENV=$ENV" >> $GITHUB_ENV
          echo "ENABLE_VM=$ENABLE_VM" >> $GITHUB_ENV
          echo "ENABLE_AKS=$ENABLE_AKS" >> $GITHUB_ENV

          case "$ENV" in
            dev)
              echo "TFVARS=environments/dev.tfvars" >> $GITHUB_ENV
              echo "TFSTATE=dev.tfstate" >> $GITHUB_ENV
              echo "BACKEND_RG=isac-tfstate-dev-rg" >> $GITHUB_ENV
              echo "BACKEND_SA=isactfstatedev" >> $GITHUB_ENV
              ;;
            itg)
              echo "TFVARS=environments/itg.tfvars" >> $GITHUB_ENV
              echo "TFSTATE=itg.tfstate" >> $GITHUB_ENV
              echo "BACKEND_RG=isac-tfstate-itg-rg" >> $GITHUB_ENV
              echo "BACKEND_SA=isactfstateitg" >> $GITHUB_ENV
              ;;
            prod)
              echo "TFVARS=environments/prod.tfvars" >> $GITHUB_ENV
              echo "TFSTATE=prod.tfstate" >> $GITHUB_ENV
              echo "BACKEND_RG=isac-tfstate-prod-rg" >> $GITHUB_ENV
              echo "BACKEND_SA=isactfstateprod" >> $GITHUB_ENV
              ;;
          esac

          echo "CONTAINER=tfstate" >> $GITHUB_ENV

# =========================
# Debug
# =========================
      - name: Debug Variables
        run: |
          echo "ENV=$ENV"
          echo "ENABLE_VM=$ENABLE_VM"
          echo "ENABLE_AKS=$ENABLE_AKS"
          echo "TFVARS=$TFVARS"

# =========================
# Terraform Init
# =========================
      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=$BACKEND_RG" \
            -backend-config="storage_account_name=$BACKEND_SA" \
            -backend-config="container_name=$CONTAINER" \
            -backend-config="key=$TFSTATE" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

# =========================
# Terraform Plan
# =========================
      - name: Terraform Plan
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.action == 'plan'
        run: |
          terraform plan \
            -var-file="$TFVARS" \
            -var="enable_vm=$ENABLE_VM" \
            -var="enable_aks=$ENABLE_AKS" \
            -out=tfplan \
            -input=false

# =========================
# Terraform Apply
# =========================
      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
        run: |
          terraform apply -auto-approve \
            -var-file="$TFVARS" \
            -var="enable_vm=$ENABLE_VM" \
            -var="enable_aks=$ENABLE_AKS" \
            -input=false

# =========================
# Terraform Destroy
# =========================
      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: |
          terraform destroy -auto-approve \
            -var-file="$TFVARS" \
            -var="enable_vm=$ENABLE_VM" \
            -var="enable_aks=$ENABLE_AKS" \
            -input=false
