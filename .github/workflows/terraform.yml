name: Terraform CICD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select Environment"
        required: true
        type: choice
        options:
          - dev
          - itg
          - prod

      action:
        description: "Select Action"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    env:
      TF_VERSION: 1.6.6

    steps:

    # ✅ Checkout
    - name: Checkout
      uses: actions/checkout@v4

    # ✅ Azure Login
    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    # ✅ Setup Terraform
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    # ✅ Set Environment Variables (like ADO variable mapping)
    - name: Set Environment Config
      id: envconfig
      run: |

        case "${{ github.event.inputs.environment }}" in
          dev)
            echo "TFVARS=environments/dev.tfvars" >> $GITHUB_ENV
            echo "TFSTATE=dev.tfstate" >> $GITHUB_ENV
            echo "BACKEND_RG=isac-tfstate-dev-rg" >> $GITHUB_ENV
            echo "BACKEND_SA=isactfstatedev" >> $GITHUB_ENV
            ;;
          itg)
            echo "TFVARS=environments/itg.tfvars" >> $GITHUB_ENV
            echo "TFSTATE=itg.tfstate" >> $GITHUB_ENV
            echo "BACKEND_RG=isac-tfstate-itg-rg" >> $GITHUB_ENV
            echo "BACKEND_SA=isactfstateitg" >> $GITHUB_ENV
            ;;
          prod)
            echo "TFVARS=environments/prod.tfvars" >> $GITHUB_ENV
            echo "TFSTATE=prod.tfstate" >> $GITHUB_ENV
            echo "BACKEND_RG=isac-tfstate-prod-rg" >> $GITHUB_ENV
            echo "BACKEND_SA=isactfstateprod" >> $GITHUB_ENV
            ;;
        esac

        echo "CONTAINER=tfstate" >> $GITHUB_ENV

    # ✅ Terraform Init
    - name: Terraform Init
      run: |
        terraform init \
          -backend-config="resource_group_name=$BACKEND_RG" \
          -backend-config="storage_account_name=$BACKEND_SA" \
          -backend-config="container_name=$CONTAINER" \
          -backend-config="key=$TFSTATE"

    # ✅ Terraform Format
    - name: Terraform Format
      run: terraform fmt -check

    # ✅ Terraform Validate
    - name: Terraform Validate
      run: terraform validate

    # ✅ Terraform Plan
    - name: Terraform Plan
      if: github.event.inputs.action == 'plan'
      run: |
        terraform plan \
          -var-file="$TFVARS" \
          -out=tfplan

    # ✅ Terraform Apply
    - name: Terraform Apply
      if: github.event.inputs.action == 'apply'
      run: |
        terraform apply \
          -var-file="$TFVARS" \
          -auto-approve

    # ✅ Terraform Destroy
    - name: Terraform Destroy
      if: github.event.inputs.action == 'destroy'
      run: |
        terraform destroy \
          -var-file="$TFVARS" \
          -auto-approve
